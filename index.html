<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="影片下載">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF3B30">
<title>影片下載器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#FF3B30;--rd:#d63328;
  --bg:#0f0f0f;--s1:#1c1c1e;--s2:#2c2c2e;
  --tx:#fff;--t2:#ababab;--br:#3a3a3c;--r:14px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--tx);min-height:100%;
  padding:calc(var(--st) + 20px) 16px calc(var(--sb) + 24px);
  -webkit-font-smoothing:antialiased;
}
.app{max-width:460px;margin:0 auto}
#installBanner{
  background:var(--s1);border-radius:12px;padding:12px 14px;
  margin-bottom:16px;display:flex;align-items:center;gap:10px;
}
#installBanner .ic{font-size:26px;flex-shrink:0}
#installBanner .t{flex:1}
#installBanner .t b{font-size:13px;display:block}
#installBanner .t span{font-size:12px;color:var(--t2)}
#installBanner button{background:none;border:none;color:var(--t2);font-size:18px;cursor:pointer;padding:4px;-webkit-tap-highlight-color:transparent}
.hd{text-align:center;margin-bottom:28px}
.hd .ico{font-size:50px;margin-bottom:6px}
.hd h1{font-size:25px;font-weight:700;letter-spacing:-.5px}
.hd p{color:var(--t2);font-size:13px;margin-top:3px}
.box{
  background:var(--s1);border:2px dashed var(--br);
  border-radius:var(--r);padding:16px;margin-bottom:10px;transition:border-color .2s;
}
.box:focus-within{border-color:var(--red)}
.box textarea{
  width:100%;background:transparent;border:none;outline:none;
  color:var(--tx);font-size:15px;line-height:1.5;resize:none;min-height:72px;font-family:inherit;
}
.box textarea::placeholder{color:var(--t2)}
.row{display:flex;gap:8px;margin-top:8px}
.btn-sm{
  border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;
  cursor:pointer;transition:opacity .15s;-webkit-tap-highlight-color:transparent;
}
.btn-sm.red{background:var(--red);color:#fff}
.btn-sm.gray{background:var(--s2);color:var(--t2)}
.btn-sm:active{opacity:.7}
.btn-main{
  width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--r);
  padding:16px;font-size:17px;font-weight:700;cursor:pointer;
  transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent;margin-bottom:22px;
}
.btn-main:active{background:var(--rd);transform:scale(.98)}
.btn-main:disabled{opacity:.4;cursor:not-allowed;transform:none}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px;color:var(--t2);font-size:13px}
.spin{width:34px;height:34px;border:3px solid var(--s2);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{
  background:rgba(255,59,48,.12);border:1px solid rgba(255,59,48,.3);
  border-radius:10px;padding:13px 15px;color:#ff6b6b;font-size:14px;margin-bottom:14px;line-height:1.5;
}
.card{background:var(--s1);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.thumb{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{
  position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;
  font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;backdrop-filter:blur(4px);
}
.info{padding:12px 15px}
.info .ttl{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .upl{font-size:12px;color:var(--t2)}
.qs{padding:0 15px 14px}
.ql{font-size:11px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.qc{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  border:1.5px solid var(--br);background:transparent;color:var(--tx);border-radius:20px;
  padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.btn-dl{
  width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--r);
  padding:15px;font-size:17px;font-weight:700;cursor:pointer;
  transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;
}
.btn-dl:active{background:var(--rd);transform:scale(.98)}
.btn-dl:disabled{opacity:.4;cursor:not-allowed;transform:none}
.prog{background:var(--s1);border-radius:var(--r);padding:14px;margin-bottom:14px}
.prog-lbl{font-size:12px;color:var(--t2);margin-bottom:8px}
.pb-bg{background:var(--s2);border-radius:4px;height:5px;overflow:hidden}
.pb{background:var(--red);height:100%;border-radius:4px;width:0%;transition:width .3s}
.vp{background:#000;border-radius:var(--r);overflow:hidden;margin-bottom:11px}
.vp video{width:100%;display:block;max-height:260px;object-fit:contain}
.picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.picker-item{position:relative;background:#000;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:9/16}
.picker-item img{width:100%;height:100%;object-fit:cover;display:block}
.picker-item::after{content:'⬇️';position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);border-radius:6px;padding:3px 6px;font-size:16px}
.ok{
  background:rgba(52,199,89,.13);border:1px solid rgba(52,199,89,.3);
  border-radius:10px;padding:13px 15px;color:#30d158;font-size:14px;font-weight:600;
  margin-bottom:11px;display:flex;align-items:center;gap:7px;
}
.tip{
  background:rgba(255,59,48,.07);border:1px solid rgba(255,59,48,.18);
  border-radius:12px;padding:14px 15px;margin-bottom:14px;
}
.tip-t{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.tip ol{padding-left:17px;font-size:12px;color:var(--t2);line-height:1.9}
.tip ol strong{color:var(--tx)}
.tip2{
  background:rgba(10,132,255,.08);border:1px solid rgba(10,132,255,.2);
  border-radius:12px;padding:13px 15px;margin-bottom:14px;font-size:13px;color:#5ac8fa;line-height:1.5;
}
.ft{text-align:center;color:var(--t2);font-size:11px;margin-top:28px}
.hidden{display:none!important}
body{-webkit-user-select:none;user-select:none}
textarea,input{-webkit-user-select:text;user-select:text}
.vp video{-webkit-touch-callout:default}
.vp{-webkit-touch-callout:default}
</style>
</head>
<body>
<div class="app">
  <div id="workerStatus" style="text-align:center;font-size:11px;color:#888;margin-bottom:14px;padding:6px;border-radius:8px;background:#1c1c1e">⏳ 檢查 Worker 連線中…</div>
  <div id="installBanner" class="hidden">
    <div class="ic">📲</div>
    <div class="t">
      <b>加入主畫面，像 App 一樣使用</b>
      <span>點底部 <strong>分享</strong> → <strong>加入主畫面</strong></span>
    </div>
    <button onclick="this.parentElement.classList.add('hidden')">✕</button>
  </div>

  <div class="hd">
    <div class="ico">🎬</div>
    <h1>影片下載器</h1>
    <p>支援 YouTube・Instagram</p>
  </div>

  <div class="box">
    <textarea id="url"
      placeholder="貼上 YouTube 或 Instagram 影片連結…&#10;例：https://youtu.be/xxxxx"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    ></textarea>
    <div class="row">
      <button class="btn-sm red" id="btnPaste">📋 貼上連結</button>
      <button class="btn-sm gray" id="btnClear">清除</button>
    </div>
  </div>

  <button class="btn-main" id="btnFetch">取得影片資訊</button>

  <div id="loading" class="spin-wrap hidden">
    <div class="spin"></div>
    <span id="loadTxt">正在取得影片資訊…</span>
  </div>

  <div id="err" class="err hidden"></div>

  <div id="result" class="hidden">
    <div class="card" id="card">
      <div class="thumb">
        <img id="thumb" src="" alt="" style="display:none">
        <span id="dur" class="dur hidden"></span>
      </div>
      <div class="info">
        <div id="ttl" class="ttl"></div>
        <div id="upl" class="upl"></div>
      </div>
      <div class="qs">
        <div class="ql">畫質選擇</div>
        <div id="chips" class="qc"></div>
      </div>
    </div>

    <div id="prog" class="prog hidden">
      <div class="prog-lbl"><span id="progLbl">準備中…</span></div>
      <div class="pb-bg"><div id="pb" class="pb"></div></div>
    </div>

    <div id="vp" class="vp hidden">
      <video id="vid" controls playsinline preload="metadata"></video>
    </div>
    <button id="btnShare2" class="btn-dl hidden" style="background:#0a84ff">📤 儲存影片到相簿</button>

    <div id="picker" class="picker-grid hidden"></div>
    <div id="ok" class="ok hidden">✓ <span id="okTxt"></span></div>

    <button class="btn-dl" id="btnDl">⬇️ 下載影片</button>

    <div class="tip">
      <div class="tip-t">📱 儲存到 iOS 相簿</div>
      <ol>
        <li>點 <strong>下載影片</strong>，等待下載完成後會自動彈出 <strong>分享單</strong> → 選 <strong>儲存影片</strong></li>
        <li>若分享單沒彈出，點 <strong>儲存影片到相簿</strong> 按鈕即可再次開啟</li>
        <li>也可<strong>長按影片畫面</strong> → <strong>儲存影片</strong></li>
      </ol>
    </div>
  </div>

  <div class="ft">僅供個人學習使用，請尊重版權 · v18</div>
</div>

<script>
const ICON_DATA_URL = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">' +
  '<rect width="192" height="192" rx="42" fill="#FF3B30"/>' +
  '<polygon points="72,52 148,96 72,140" fill="white"/>' +
  '</svg>'
);

(function(){
'use strict';

const API_ENDPOINT = 'https://video-api.s0937854008.workers.dev/';
const PROXY_ENDPOINT = 'https://video-api.s0937854008.workers.dev/proxy?u=';
const DOWNLOAD_ENDPOINT = 'https://video-api.s0937854008.workers.dev/download';
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const proxify = u => PROXY_ENDPOINT + encodeURIComponent(u);

function fetchWithTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const tid = setTimeout(()=>ctrl.abort(), ms);
  return fetch(url, Object.assign({}, opts, {signal: ctrl.signal}))
    .finally(()=>clearTimeout(tid));
}

setTimeout(function(){
  const el = document.getElementById('workerStatus');
  if(!el) return;
  fetchWithTimeout(API_ENDPOINT, {method:'GET'}, 8000)
    .then(function(r){
      if(r.ok || r.status < 500){
        el.textContent = '✅ Worker 已連線 (' + r.status + ')';
        el.style.color = '#30d158';
      } else {
        el.textContent = '⚠️ Worker 回應 HTTP ' + r.status;
        el.style.color = '#ffd60a';
      }
    })
    .catch(function(e){
      el.innerHTML = '❌ Worker 無法連線：' + (e && e.message ? e.message : 'error') +
        '　<a href="' + API_ENDPOINT + '" target="_blank" style="color:#5ac8fa">直接開啟</a>';
      el.style.color = '#ff6b6b';
    });
}, 100);

async function cobaltFetch(payload) {
  try {
    const resp = await fetchWithTimeout(API_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify(payload),
    }, 35000);
    if (!resp.ok) {
      let detail = 'HTTP '+resp.status;
      try {
        const j = await resp.json();
        if(j.error && j.error.code){
          detail = j.error.code;
          if(j.error.detail) detail += ' (' + j.error.detail + ')';
        }
      } catch(_) {}
      throw new Error(detail);
    }
    const data = await resp.json();
    if (data.status === 'error') {
      throw new Error((data.error && data.error.code) || data.text || '伺服器拒絕此連結');
    }
    return data;
  } catch(e) {
    if (e.name === 'AbortError') throw new Error('連線逾時，請稍後再試');
    throw new Error((e && e.message ? e.message : 'error') + ' [' + (e && e.name ? e.name : '?') + ']');
  }
}

const manifest = {
  name:'影片下載器',short_name:'影片下載',
  start_url:location.pathname,display:'standalone',
  background_color:'#0f0f0f',theme_color:'#FF3B30',
  icons:[{src:ICON_DATA_URL,sizes:'192x192',type:'image/png',purpose:'any maskable'}]
};
const mBlob = new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
const mEl = document.createElement('link');
mEl.rel='manifest'; mEl.href=URL.createObjectURL(mBlob);
document.head.appendChild(mEl);

const iconLink = document.createElement('link');
iconLink.rel='apple-touch-icon'; iconLink.href=ICON_DATA_URL;
document.head.appendChild(iconLink);

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  });
  if('caches' in window){
    caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));
  }
}

if(isIOS && window.navigator.standalone !== true){
  document.getElementById('installBanner').classList.remove('hidden');
}

const $ = id => document.getElementById(id);
let state = {url:'',cobaltUrl:'',quality:'max',isPicker:false,videoFile:null,sharing:false};

$('btnPaste').onclick = async () => {
  try { const t=await navigator.clipboard.readText(); if(t)$('url').value=t.trim(); }
  catch { $('url').focus(); }
};
$('btnClear').onclick = () => { $('url').value=''; reset(); };
$('url').addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();go();} });
$('btnFetch').onclick = go;
$('btnDl').onclick = download;
$('btnShare2').onclick = reshare;

function reset(){
  ['result','err','prog','vp','ok','picker','btnShare2'].forEach(id=>$(id).classList.add('hidden'));
  $('pb').style.width='0%';
  state={url:'',cobaltUrl:'',quality:'max',isPicker:false,videoFile:null};
}

function showErr(msg){
  $('err').innerHTML = '';
  const p = document.createElement('div');
  p.textContent = msg;
  $('err').appendChild(p);
  if(state.url){
    const a = document.createElement('a');
    const target = /instagram\.com/i.test(state.url)
      ? 'https://saveclip.app/en?url=' + encodeURIComponent(state.url)
      : 'https://en1.savefrom.net/1-youtube-video-downloader/#url=' + encodeURIComponent(state.url);
    a.href = target; a.target = '_blank'; a.rel = 'noopener';
    a.style.cssText = 'display:inline-block;margin-top:10px;color:#5ac8fa;font-size:13px;text-decoration:underline';
    a.textContent = '👉 改用 saveclip / savefrom 開啟';
    $('err').appendChild(a);
  }
  $('err').classList.remove('hidden');
  $('loading').classList.add('hidden');
}

async function go(){
  const url=$('url').value.trim();
  if(!url) return;
  if(!/youtube\.com|youtu\.be|instagram\.com/i.test(url)){
    showErr('請貼上 YouTube 或 Instagram 連結'); return;
  }
  reset();
  state.url=url;
  $('loading').classList.remove('hidden');
  $('loadTxt').textContent='正在取得影片資訊（YouTube 可能需 10-15 秒）…';
  $('btnFetch').disabled=true;
  try{
    const data = await cobaltFetch({url, videoQuality:'1080'});
    $('loading').classList.add('hidden');
    $('btnFetch').disabled=false;
    if(data.status==='picker'){ showPicker(data.picker||[]); return; }
    if(data.url){
      state.cobaltUrl=data.url;
      showCard(url, data);
    } else {
      showErr('取得影片失敗，請換一個連結試試');
    }
  }catch(e){
    $('loading').classList.add('hidden');
    $('btnFetch').disabled=false;
    showErr('無法取得影片：'+e.message);
  }
}

function fmtDur(sec){
  if(!sec||sec<=0) return '';
  const m=Math.floor(sec/60), s=sec%60;
  return m+':'+(s<10?'0':'')+s;
}

function showCard(url, data){
  const isYT=/youtube\.com|youtu\.be/.test(url);
  $('thumb').style.display='none';
  $('dur').classList.add('hidden');
  $('ttl').textContent=isYT?'YouTube 影片':'Instagram 影片';
  $('upl').textContent='';
  // Thumbnail from ytimg
  if(isYT){
    const m=url.match(/(?:v=|youtu\.be\/)([\w-]{11})/);
    if(m){
      const img=$('thumb');
      img.src='https://i.ytimg.com/vi/'+m[1]+'/hqdefault.jpg';
      img.style.display='block';
      img.onerror=()=>{img.style.display='none';};
    }
  }
  const qualities=isYT
    ?[['max','最高畫質'],['720','720p'],['480','480p'],['360','360p']]
    :[['max','最高畫質']];
  $('chips').innerHTML='';
  qualities.forEach(([q,label],i)=>{
    const c=document.createElement('button');
    c.className='chip'+(i===0?' on':'');
    c.textContent=label; c.dataset.q=q;
    c.onclick=async()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); state.quality=q;
      await refetch(q);
    };
    $('chips').appendChild(c);
  });
  state.quality='max';
  $('result').classList.remove('hidden');
}

async function refetch(quality){
  $('loadTxt').textContent='切換畫質…';
  $('loading').classList.remove('hidden');
  try{
    const data = await cobaltFetch({url:state.url, videoQuality:quality});
    $('loading').classList.add('hidden');
    if(data.url) state.cobaltUrl=data.url;
  }catch{ $('loading').classList.add('hidden'); }
}

function showPicker(items){
  state.isPicker=true;
  $('result').classList.remove('hidden');
  $('card').classList.add('hidden');
  $('btnDl').classList.add('hidden');
  const p=$('picker');
  p.innerHTML='';
  items.forEach((item,i)=>{
    const div=document.createElement('div');
    div.className='picker-item';
    const img=document.createElement('img');
    img.src=item.thumb||''; img.alt='clip '+(i+1);
    img.onerror=()=>{img.style.display='none';};
    div.appendChild(img);
    div.onclick=()=>{ isIOS ? (window.location.href=item.url) : triggerDownload(item.url); };
    p.appendChild(div);
  });
  p.classList.remove('hidden');
  const tip=document.createElement('div');
  tip.className='tip2';
  tip.innerHTML='🎞️ 此貼文有多個影片，點擊每張縮圖即可個別儲存。';
  p.insertAdjacentElement('afterend',tip);
}

async function download(){
  if(state.isPicker) return;
  const isYT = /youtube\.com|youtu\.be/.test(state.url);
  if(isYT){
    // YouTube: use /download endpoint (all-in-one to avoid IP mismatch)
    isIOS ? downloadYTForIOS() : downloadYTDirect();
    return;
  }
  // Instagram: re-fetch URL then use proxy
  $('loadTxt').textContent='取得下載連結…';
  $('loading').classList.remove('hidden');
  try{
    const data = await cobaltFetch({url:state.url, videoQuality:state.quality});
    $('loading').classList.add('hidden');
    if(!data.url){showErr('下載連結取得失敗');return;}
    state.cobaltUrl=data.url;
  }catch(e){$('loading').classList.add('hidden');showErr('下載失敗：'+e.message);return;}
  isIOS ? loadVideoForIOS(state.cobaltUrl) : triggerDownload(state.cobaltUrl);
}

async function downloadYTForIOS(){
  $('ok').classList.add('hidden');
  $('prog').classList.remove('hidden');
  $('pb').style.width='10%';
  $('progLbl').textContent='下載影片中（合併取得+下載）…';
  $('btnDl').disabled=true;
  try{
    const r = await fetchWithTimeout(DOWNLOAD_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:state.url, videoQuality:state.quality}),
    }, 120000);
    if(!r.ok){
      let msg='HTTP '+r.status;
      try{const j=await r.json();if(j.error)msg=j.error.code||j.error.detail||msg;}catch(_){}
      throw new Error(msg);
    }
    const total = +(r.headers.get('Content-Length')||0);
    const reader = r.body.getReader();
    const chunks=[]; let received=0;
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      chunks.push(value); received+=value.length;
      if(total){
        const pct = Math.min(95, Math.round(received/total*100));
        $('pb').style.width = pct+'%';
        $('progLbl').textContent = '下載中… '+pct+'%';
      } else {
        $('progLbl').textContent = '下載中… '+(received>>20)+' MB';
      }
    }
    const blob = new Blob(chunks, {type:'video/mp4'});

    $('pb').style.width='100%';

function downloadYTDirect(){
  // Desktop: open /download as a direct link (browser handles the download)
  const form = document.createElement('form');
  form.method='POST'; form.action=DOWNLOAD_ENDPOINT; form.target='_blank';
  const i1=document.createElement('input'); i1.type='hidden'; i1.name='url'; i1.value=state.url;
  const i2=document.createElement('input'); i2.type='hidden'; i2.name='videoQuality'; i2.value=state.quality;
  form.appendChild(i1); form.appendChild(i2);
  document.body.appendChild(form); form.submit(); document.body.removeChild(form);
  $('ok').classList.remove('hidden');
  $('okTxt').textContent='開始下載中…';
}

async function shareVideoFile(url){
  $('ok').classList.add('hidden');
  $('prog').classList.remove('hidden');
  $('pb').style.width='10%';
  $('progLbl').textContent='下載影片中…';
  $('btnDl').disabled=true;
  try{
    // All URLs from Worker are now HTTPS (tunnel URLs rewritten to our proxy)
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const total = +(r.headers.get('Content-Length')||0);
    const reader = r.body.getReader();
    const chunks=[]; let received=0;
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      chunks.push(value); received+=value.length;
      if(total){
        const pct = Math.min(95, Math.round(received/total*100));
        $('pb').style.width = pct+'%';
        $('progLbl').textContent = '下載中… '+pct+'%';
      } else {
        $('progLbl').textContent = '下載中… '+(received>>20)+' MB';
      }
    }
    const blob = new Blob(chunks, {type:'video/mp4'});
    const file = new File([blob], 'video.mp4', {type:'video/mp4'});
    $('pb').style.width='100%';
    $('prog').classList.add('hidden');
    $('btnDl').disabled=false;

    state.videoFile = file;
    const blobUrl = URL.createObjectURL(blob);
    if(navigator.canShare && navigator.canShare({files:[file]}) && !state.sharing){
      try{
        state.sharing=true;
        await navigator.share({files:[file]});
        $('ok').classList.remove('hidden');
        $('okTxt').textContent='已開啟分享單，點「儲存影片」存入相簿';
        return;
      }catch(e){
        if(e && e.name==='AbortError') return;
      }finally{ state.sharing=false; }
    }
    showBlobFallback(blobUrl, file);
  }catch(e){
    $('prog').classList.add('hidden');
    $('btnDl').disabled=false;
    showErr('下載失敗：'+e.message);
  }
}

function showBlobFallback(blobUrl, file){
  const v=$('vid');
  v.src=blobUrl; v.load();
  $('vp').classList.remove('hidden');
  $('ok').classList.remove('hidden');
  $('okTxt').textContent='長按影片 →「儲存影片」，或點下方按鈕';
  if(navigator.canShare && navigator.canShare({files:[file]})){
    $('btnShare2').classList.remove('hidden');
  }
}

async function reshare(){
  const file = state.videoFile;
  if(!file){ showErr('請先點擊下載影片'); return; }
  if(state.sharing) return;
  try{
    state.sharing=true;
    await navigator.share({files:[file]});
    $('ok').classList.remove('hidden');
    $('okTxt').textContent='已開啟分享單，點「儲存影片」存入相簿';
  }catch(e){
    if(e && e.name==='AbortError') return;
    showErr('分享失敗：'+e.message);
  }finally{ state.sharing=false; }
}

function loadVideoForIOS(url){
  shareVideoFile(url);
}

function triggerDownload(url){
  const a=document.createElement('a');
  a.href=url; a.download='video.mp4';
  a.style.display='none';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  $('ok').classList.remove('hidden');
  $('okTxt').textContent='開始下載中…';
}

})();
