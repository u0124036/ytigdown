</div>

<script>
// Icon must be defined first (used in manifest below)
const ICON_DATA_URL = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">' +
  '<rect width="192" height="192" rx="42" fill="#FF3B30"/>' +
  '<polygon points="72,52 148,96 72,140" fill="white"/>' +
  '</svg>'
);

(function(){
'use strict';

// Cloudflare Worker proxy (handles CORS + tries multiple cobalt instances)
const API_ENDPOINT = 'https://video-api.s0937854008.workers.dev/';
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

// Test Worker connectivity on load (non-blocking)
(async()=>{
  const el = document.getElementById('workerStatus');
  try {
    const r = await fetch(API_ENDPOINT, {
      method: 'GET',
      signal: AbortSignal.timeout(8000)
    });
    if(r.ok || r.status < 500){
      el.textContent = '✅ Worker 已連線';
      el.style.color = '#30d158';
    } else {
      el.textContent = '⚠️ Worker 回應 HTTP ' + r.status;
      el.style.color = '#ffd60a';
    }
  } catch(e) {
    el.innerHTML = '❌ Worker 無法連線 (' + e.message + ')　<a href="' + API_ENDPOINT + '" target="_blank" style="color:#5ac8fa">直接開啟測試</a>';
    el.style.color = '#ff6b6b';
  }
})();

async function cobaltFetch(payload) {
  try {
    const resp = await fetch(API_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify(payload),
      signal: AbortSignal.timeout(20000)
    });
    if (!resp.ok) {
      let detail = 'HTTP '+resp.status;
      try { const j = await resp.json(); if(j.error?.code) detail = j.error.code; } catch {}
      throw new Error(detail);
    }
    const data = await resp.json();
    if (data.status === 'error') {
      throw new Error(data.error?.code || data.text || '伺服器拒絕此連結');
    }
    return data;
  } catch(e) {
    if (e.name === 'TimeoutError') throw new Error('伺服器逾時');
    if (e.name === 'AbortError') throw new Error('請求被取消');
    throw new Error(e.message + ' [' + e.name + ']');
  }
}
