<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="影片下載">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF3B30">
<title>影片下載器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#FF3B30;--rd:#d63328;
  --bg:#0f0f0f;--s1:#1c1c1e;--s2:#2c2c2e;
  --tx:#fff;--t2:#ababab;--br:#3a3a3c;--r:14px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--tx);min-height:100%;
  padding:calc(var(--st) + 20px) 16px calc(var(--sb) + 24px);
  -webkit-font-smoothing:antialiased;
}
.app{max-width:460px;margin:0 auto}
#installBanner{
  background:var(--s1);border-radius:12px;padding:12px 14px;
  margin-bottom:16px;display:flex;align-items:center;gap:10px;
}
#installBanner .ic{font-size:26px;flex-shrink:0}
#installBanner .t{flex:1}
#installBanner .t b{font-size:13px;display:block}
#installBanner .t span{font-size:12px;color:var(--t2)}
#installBanner button{background:none;border:none;color:var(--t2);font-size:18px;cursor:pointer;padding:4px;-webkit-tap-highlight-color:transparent}
.hd{text-align:center;margin-bottom:28px}
.hd .ico{font-size:50px;margin-bottom:6px}
.hd h1{font-size:25px;font-weight:700;letter-spacing:-.5px}
.hd p{color:var(--t2);font-size:13px;margin-top:3px}
.box{
  background:var(--s1);border:2px dashed var(--br);
  border-radius:var(--r);padding:16px;margin-bottom:10px;transition:border-color .2s;
}
.box:focus-within{border-color:var(--red)}
.box textarea{
  width:100%;background:transparent;border:none;outline:none;
  color:var(--tx);font-size:15px;line-height:1.5;resize:none;min-height:72px;font-family:inherit;
}
.box textarea::placeholder{color:var(--t2)}
.row{display:flex;gap:8px;margin-top:8px}
.btn-sm{
  border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;
  cursor:pointer;transition:opacity .15s;-webkit-tap-highlight-color:transparent;
}
.btn-sm.red{background:var(--red);color:#fff}
.btn-sm.gray{background:var(--s2);color:var(--t2)}
.btn-sm:active{opacity:.7}
.btn-main{
  width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--r);
  padding:16px;font-size:17px;font-weight:700;cursor:pointer;
  transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent;margin-bottom:22px;
}
.btn-main:active{background:var(--rd);transform:scale(.98)}
.btn-main:disabled{opacity:.4;cursor:not-allowed;transform:none}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px;color:var(--t2);font-size:13px}
.spin{width:34px;height:34px;border:3px solid var(--s2);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{
  background:rgba(255,59,48,.12);border:1px solid rgba(255,59,48,.3);
  border-radius:10px;padding:13px 15px;color:#ff6b6b;font-size:14px;margin-bottom:14px;line-height:1.5;
}
.card{background:var(--s1);border-radius:var(--r);overflow:hidden;margin-bottom:10px;display:flex;align-items:stretch}
.thumb{position:relative;background:#000;width:120px;min-height:68px;flex-shrink:0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{
  position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;
  font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;backdrop-filter:blur(4px);
}
.info{padding:8px 12px;flex:1;min-width:0}
.info .ttl{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .upl{font-size:11px;color:var(--t2)}
.qs{padding:0 12px 10px}
.ql{font-size:10px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.qc{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  border:1.5px solid var(--br);background:transparent;color:var(--tx);border-radius:20px;
  padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.btn-dl{
  width:100%;background:var(--red);color:#fff;border:none;border-radius:var(--r);
  padding:15px;font-size:17px;font-weight:700;cursor:pointer;
  transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;
}
.btn-dl:active{background:var(--rd);transform:scale(.98)}
.btn-dl:disabled{opacity:.4;cursor:not-allowed;transform:none}
.prog{background:var(--s1);border-radius:var(--r);padding:10px 14px;margin-bottom:10px}
.prog-lbl{font-size:12px;color:var(--t2);margin-bottom:8px}
.pb-bg{background:var(--s2);border-radius:4px;height:5px;overflow:hidden}
.pb{background:var(--red);height:100%;border-radius:4px;width:0%;transition:width .5s ease-out}
.vp{background:#000;border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.vp video{width:100%;display:block;max-height:180px;object-fit:contain}
.picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.picker-item{position:relative;background:#000;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:9/16}
.picker-item img{width:100%;height:100%;object-fit:cover;display:block}
.picker-item::after{content:'⬇️';position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);border-radius:6px;padding:3px 6px;font-size:16px}
.ok{
  background:rgba(52,199,89,.13);border:1px solid rgba(52,199,89,.3);
  border-radius:10px;padding:13px 15px;color:#30d158;font-size:14px;font-weight:600;
  margin-bottom:11px;display:flex;align-items:center;gap:7px;
}
.tip{
  background:rgba(255,59,48,.07);border:1px solid rgba(255,59,48,.18);
  border-radius:12px;padding:14px 15px;margin-bottom:14px;
}
.tip-t{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.tip ol{padding-left:17px;font-size:12px;color:var(--t2);line-height:1.9}
.tip ol strong{color:var(--tx)}
.tip2{
  background:rgba(10,132,255,.08);border:1px solid rgba(10,132,255,.2);
  border-radius:12px;padding:13px 15px;margin-bottom:14px;font-size:13px;color:#5ac8fa;line-height:1.5;
}
.ft{text-align:center;color:var(--t2);font-size:11px;margin-top:28px}
.hidden{display:none!important}
.status-log{background:var(--s1);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12px;font-family:monospace}
.status-log .sl-item{display:flex;align-items:center;gap:6px;padding:2px 0;color:var(--t2)}
.status-log .sl-item.trying{color:#888}
.status-log .sl-item.ok{color:#30d158}
.status-log .sl-item.fail{color:#ff6b6b}
.toast-container{position:fixed;bottom:calc(var(--sb) + 16px);left:16px;right:16px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{max-width:460px;width:100%;background:var(--s2);border:1px solid rgba(255,59,48,.3);border-radius:12px;padding:13px 38px 13px 15px;color:#ff6b6b;font-size:14px;line-height:1.5;position:relative;pointer-events:auto;transform:translateY(100px);opacity:0;animation:toastIn .3s ease forwards;touch-action:pan-x;-webkit-user-select:none;user-select:none}
.toast a{display:inline-block;margin-top:8px;color:#5ac8fa;font-size:13px;text-decoration:underline}
.toast .tc{position:absolute;top:8px;right:8px;background:none;border:none;color:#888;font-size:18px;cursor:pointer;padding:4px;line-height:1;-webkit-tap-highlight-color:transparent}
@keyframes toastIn{to{transform:translateY(0);opacity:1}}
body{-webkit-user-select:none;user-select:none}
textarea,input{-webkit-user-select:text;user-select:text}
.vp video{-webkit-touch-callout:default}
.vp{-webkit-touch-callout:default}
</style>
</head>
<body>
<div class="app">
  <div id="workerStatus" style="text-align:center;font-size:11px;color:#888;margin-bottom:14px;padding:6px;border-radius:8px;background:#1c1c1e">⏳ 檢查 Worker 連線中…</div>
  <div id="installBanner" class="hidden">
    <div class="ic">📲</div>
    <div class="t">
      <b>加入主畫面，像 App 一樣使用</b>
      <span>點底部 <strong>分享</strong> → <strong>加入主畫面</strong></span>
    </div>
    <button onclick="this.parentElement.classList.add('hidden')">✕</button>
  </div>

  <div class="hd">
    <div class="ico">🎬</div>
    <h1>影片下載器</h1>
    <p>支援 YouTube・Instagram</p>
  </div>

  <div class="box">
    <textarea id="url"
      placeholder="貼上 YouTube 或 Instagram 影片連結…&#10;例：https://youtu.be/xxxxx"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    ></textarea>
    <div class="row">
      <button class="btn-sm red" id="btnPaste">📋 貼上連結</button>
      <button class="btn-sm gray" id="btnClear">清除</button>
    </div>
  </div>

  <button class="btn-main" id="btnFetch">取得影片資訊</button>

  <div id="loading" class="spin-wrap hidden">
    <div class="spin"></div>
    <span id="loadTxt">正在取得影片資訊…</span>
  </div>

  <div id="result" class="hidden">
    <div class="card" id="card">
      <div class="thumb">
        <img id="thumb" src="" alt="" style="display:none">
      </div>
      <div class="info">
        <div id="ttl" class="ttl"></div>
        <div id="upl" class="upl"></div>
      </div>
    </div>

    <div class="qs" id="qsWrap" style="margin-bottom:8px">
      <div class="ql">畫質選擇</div>
      <div id="chips" class="qc"></div>
    </div>

    <button class="btn-dl" id="btnDl">⬇️ 下載影片</button>

    <div id="statusLog" class="status-log hidden"></div>

    <div id="prog" class="prog hidden">
      <div class="prog-lbl"><span id="progLbl">準備中…</span></div>
      <div class="pb-bg"><div id="pb" class="pb"></div></div>
    </div>

    <div id="vp" class="vp hidden">
      <video id="vid" controls playsinline preload="metadata"></video>
    </div>

    <div id="saveActions" class="hidden" style="display:flex;gap:8px;margin-bottom:10px">
      <button id="btnSavePhotos" class="btn-dl" style="flex:1;margin-bottom:0;background:#0a84ff;font-size:14px;padding:12px">🖼️ 儲存到相簿</button>
      <button id="btnSaveFiles" class="btn-dl" style="flex:1;margin-bottom:0;background:#30d158;font-size:14px;padding:12px">📁 儲存到檔案</button>
    </div>

    <div id="picker" class="picker-grid hidden"></div>
    <div id="ok" class="ok hidden">✓ <span id="okTxt"></span></div>
  </div>

  <div class="ft">僅供個人學習使用，請尊重版權 · v25</div>
</div>

<script>
const ICON_DATA_URL = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">' +
  '<rect width="192" height="192" rx="42" fill="#FF3B30"/>' +
  '<polygon points="72,52 148,96 72,140" fill="white"/>' +
  '</svg>'
);

(function(){
'use strict';

const API_ENDPOINT = 'https://video-api.s0937854008.workers.dev/';
const DOWNLOAD_ENDPOINT = 'https://video-api.s0937854008.workers.dev/download';
const HEALTH_ENDPOINT = 'https://video-api.s0937854008.workers.dev/health';
const MAX_BROWSER_DOWNLOAD_BYTES = 250 * 1024 * 1024;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

function fetchWithTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const tid = setTimeout(()=>ctrl.abort(), ms);
  return fetch(url, Object.assign({}, opts, {signal: ctrl.signal}))
    .finally(()=>clearTimeout(tid));
}

setTimeout(function(){
  const el = document.getElementById('workerStatus');
  if(!el) return;
  fetchWithTimeout(HEALTH_ENDPOINT, {method:'GET'}, 10000)
    .then(function(r){
      return r.json().then(function(data){return {status:r.status, data:data};});
    })
    .then(function(res){
      const providers = Array.isArray(res.data.providers) ? res.data.providers : [];
      const online = providers.filter(function(p){return p.ok;}).length;
      const primary = !!res.data.primaryConfigured;
      if(res.status < 500 && online > 0){
        el.textContent = (primary ? '✅ 主下載通道已連線' : '⚠️ 使用公開備援通道') + ' (' + online + '/' + providers.length + ')';
        el.style.color = primary ? '#30d158' : '#ffd60a';
      } else if(res.status < 500){
        el.textContent = '⚠️ Worker 可連線，但下載通道皆無回應';
        el.style.color = '#ffd60a';
      } else {
        el.textContent = '⚠️ Worker 回應 HTTP ' + res.status;
        el.style.color = '#ffd60a';
      }
    })
    .catch(function(e){
      el.innerHTML = '❌ Worker 無法連線：' + (e && e.message ? e.message : 'error') +
        '　<a href="' + API_ENDPOINT + '" target="_blank" style="color:#5ac8fa">直接開啟</a>';
      el.style.color = '#ff6b6b';
    });
}, 100);

async function cobaltFetch(payload) {
  try {
    const resp = await fetchWithTimeout(API_ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify(payload),
    }, 35000);
    if (!resp.ok) {
      let detail = 'HTTP '+resp.status;
      try {
        const j = await resp.json();
        if(j.error && j.error.code){
          detail = j.error.code;
          if(j.error.detail) detail += ' (' + j.error.detail + ')';
        }
      } catch(_) {}
      throw new Error(detail);
    }
    const data = await resp.json();
    if (data.status === 'error') {
      throw new Error((data.error && data.error.code) || data.text || '伺服器拒絕此連結');
    }
    return data;
  } catch(e) {
    if (e.name === 'AbortError') throw new Error('連線逾時，請稍後再試');
    throw new Error((e && e.message ? e.message : 'error') + ' [' + (e && e.name ? e.name : '?') + ']');
  }
}

const manifest = {
  name:'影片下載器',short_name:'影片下載',
  start_url:location.pathname,display:'standalone',
  background_color:'#0f0f0f',theme_color:'#FF3B30',
  icons:[{src:ICON_DATA_URL,sizes:'192x192',type:'image/png',purpose:'any maskable'}]
};
const mBlob = new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
const mEl = document.createElement('link');
mEl.rel='manifest'; mEl.href=URL.createObjectURL(mBlob);
document.head.appendChild(mEl);

const iconLink = document.createElement('link');
iconLink.rel='apple-touch-icon'; iconLink.href=ICON_DATA_URL;
document.head.appendChild(iconLink);

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  });
  if('caches' in window){
    caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));
  }
}

if(isIOS && window.navigator.standalone !== true){
  document.getElementById('installBanner').classList.remove('hidden');
}

const $ = id => document.getElementById(id);
let state = {url:'',cobaltUrl:'',quality:'max',isPicker:false,videoFile:null,sharing:false,blobUrl:null,downloading:false};

$('btnPaste').onclick = async () => {
  try { const t=await navigator.clipboard.readText(); if(t)$('url').value=t.trim(); }
  catch { $('url').focus(); }
};
$('btnClear').onclick = () => { $('url').value=''; reset(); };
$('url').addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();go();} });
$('btnFetch').onclick = go;
$('btnDl').onclick = download;
$('btnSavePhotos').onclick = () => saveToPhotos();
$('btnSaveFiles').onclick = () => saveToFiles();

function reset(){
  ['result','prog','vp','ok','picker','saveActions','statusLog'].forEach(id=>$(id).classList.add('hidden'));
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  $('pb').style.width='0%';
  $('statusLog').innerHTML='';
  state={url:'',cobaltUrl:'',quality:'max',isPicker:false,videoFile:null,sharing:false,blobUrl:null,downloading:false};
}

function showToast(msg, linkUrl){
  let ct=document.getElementById('toastContainer');
  if(!ct){ct=document.createElement('div');ct.id='toastContainer';ct.className='toast-container';document.body.appendChild(ct);}
  const t=document.createElement('div');t.className='toast';
  const txt=document.createElement('div');txt.textContent=msg;t.appendChild(txt);
  if(linkUrl){const a=document.createElement('a');a.href=linkUrl;a.target='_blank';a.rel='noopener';a.textContent='👉 改用備用網站開啟';t.appendChild(a);}
  const cb=document.createElement('button');cb.className='tc';cb.textContent='✕';cb.onclick=()=>dismiss();t.appendChild(cb);
  t.addEventListener('animationend',()=>{t.style.animation='none';t.style.transform='translateY(0)';},{once:true});
  let sx=0,cx=0;
  t.ontouchstart=e=>{sx=cx=e.touches[0].clientX;};
  t.ontouchmove=e=>{cx=e.touches[0].clientX;const dx=cx-sx;t.style.transform='translateX('+dx+'px)';t.style.opacity=String(Math.max(0,1-Math.abs(dx)/200));};
  t.ontouchend=()=>{if(Math.abs(cx-sx)>80)dismiss();else{t.style.transform='translateY(0)';t.style.opacity='1';}};
  ct.appendChild(t);
  const tm=setTimeout(()=>dismiss(),6000);
  function dismiss(){clearTimeout(tm);const dir=(cx-sx)>=0?1:-1;t.style.transition='transform .25s ease,opacity .25s ease';t.style.transform='translateX('+(dir*120)+'px)';t.style.opacity='0';setTimeout(()=>t.remove(),300);}
}

function showErr(msg){
  let linkUrl=null;
  if(state.url){
    linkUrl=/instagram\.com/i.test(state.url)
      ? 'https://saveclip.app/en?url='+encodeURIComponent(state.url)
      : 'https://en1.savefrom.net/1-youtube-video-downloader/#url='+encodeURIComponent(state.url);
  }
  showToast(msg, linkUrl);
  $('loading').classList.add('hidden');
}

async function go(){
  const url=$('url').value.trim();
  if(!url) return;
  if(!/youtube\.com|youtu\.be|instagram\.com/i.test(url)){
    showErr('請貼上 YouTube 或 Instagram 連結'); return;
  }
  reset();
  state.url=url;
  $('btnFetch').disabled=true;

  const isYT=/youtube\.com|youtu\.be/.test(url);
  const isIG=/instagram\.com/.test(url);

  if(isYT){
    // YouTube: show card immediately (no API call needed for info)
    showYTCard(url);
    $('btnFetch').disabled=false;
    // Don't auto-download — let user pick quality first
    return;
  }

  // Instagram: need API to get URL
  $('loading').classList.remove('hidden');
  $('loadTxt').textContent='正在取得 Instagram 影片資訊…';
  try{
    const data = await cobaltFetch({url, videoQuality:'max'});
    $('loading').classList.add('hidden');
    $('btnFetch').disabled=false;
    if(data.status==='picker'){ showPicker(data.picker||[]); return; }
    if(data.url){
      state.cobaltUrl=data.url;
      showIGCard(url, data);
    } else {
      showErr('取得影片失敗，請換一個連結試試');
    }
  }catch(e){
    $('loading').classList.add('hidden');
    $('btnFetch').disabled=false;
    showErr('無法取得影片：'+e.message);
  }
}

function showYTCard(url){
  const m=url.match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/);
  $('thumb').style.display='none';
  if(m){
    const img=$('thumb');
    img.src='https://i.ytimg.com/vi/'+m[1]+'/mqdefault.jpg';
    img.style.display='block';
    img.onerror=()=>{
      // Fallback to hqdefault
      img.onerror=()=>{img.style.display='none';};
      img.src='https://i.ytimg.com/vi/'+m[1]+'/hqdefault.jpg';
    };
  }
  $('ttl').textContent='YouTube 影片';
  $('upl').textContent='選擇畫質後點擊下載';
  const qualities=[['max','最高畫質'],['720','720p'],['480','480p'],['360','360p']];
  $('chips').innerHTML='';
  qualities.forEach(([q,label],i)=>{
    const c=document.createElement('button');
    c.className='chip'+(i===0?' on':'');
    c.textContent=label; c.dataset.q=q;
    c.onclick=()=>{
      if(state.downloading) return;
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); state.quality=q;
    };
    $('chips').appendChild(c);
  });
  state.quality='max';
  $('qsWrap').classList.remove('hidden');
  $('btnDl').classList.remove('hidden');
  $('result').classList.remove('hidden');
}

function showIGCard(url, data){
  $('thumb').style.display='none';
  $('ttl').textContent='Instagram 影片';
  $('upl').textContent='點擊下載';
  $('chips').innerHTML='';
  const c=document.createElement('button');
  c.className='chip on'; c.textContent='最高畫質'; c.dataset.q='max';
  $('chips').appendChild(c);
  state.quality='max';
  $('qsWrap').classList.remove('hidden');
  $('btnDl').classList.remove('hidden');
  $('result').classList.remove('hidden');
}

function showPicker(items){
  state.isPicker=true;
  $('result').classList.remove('hidden');
  $('card').classList.add('hidden');
  $('qsWrap').classList.add('hidden');
  $('btnDl').classList.add('hidden');
  const p=$('picker');
  p.innerHTML='';
  items.forEach((item,i)=>{
    const div=document.createElement('div');
    div.className='picker-item';
    const img=document.createElement('img');
    img.src=item.thumb||''; img.alt='clip '+(i+1);
    img.onerror=()=>{img.style.display='none';};
    div.appendChild(img);
    div.onclick=()=>{ isIOS ? (window.location.href=item.url) : triggerDownload(item.url); };
    p.appendChild(div);
  });
  p.classList.remove('hidden');
  const tip=document.createElement('div');
  tip.className='tip2';
  tip.innerHTML='🎞️ 此貼文有多個影片，點擊每張縮圖即可個別儲存。';
  p.insertAdjacentElement('afterend',tip);
}

async function download(){
  if(state.isPicker || state.downloading) return;
  state.downloading=true;
  $('btnDl').disabled=true;
  const isYT = /youtube\.com|youtu\.be/.test(state.url);
  if(isYT){
    isIOS ? await downloadWithStatus() : downloadYTDirect();
    return;
  }
  await downloadWithStatus();
}

function indexOfBytes(buf,pat){
  const pl=pat.length;
  outer:for(let i=0;i<=buf.length-pl;i++){for(let j=0;j<pl;j++) if(buf[i+j]!==pat[j]) continue outer;return i;}
  return -1;
}

/* Download with status reporting (binary-safe) */
async function downloadWithStatus(){
  $('ok').classList.add('hidden');
  $('saveActions').classList.add('hidden');
  $('vp').classList.add('hidden');
  $('statusLog').innerHTML='';
  $('statusLog').classList.remove('hidden');
  $('prog').classList.remove('hidden');
  $('pb').style.width='0%';
  $('progLbl').textContent='尋找可用伺服器…';
  let totalSize=0, filename='video.mp4';
  function parseLine(line){
    if(!line.trim()) return;
    let ev;
    try{ ev=JSON.parse(line); }catch(_){ return; }
    updateStatusLog(ev);
    if(ev.status==='ok'){
      totalSize=ev.size||0;
      if(ev.filename) filename=ev.filename;
      if(totalSize > MAX_BROWSER_DOWNLOAD_BYTES) throw new Error('影片過大，請改用桌面直接下載');
    }
    if(ev.status==='error') throw new Error(ev.detail||'all_failed');
  }

  try{
    const r = await fetchWithTimeout(DOWNLOAD_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:state.url, videoQuality:state.quality}),
    }, 120000);

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    const DELIM = new TextEncoder().encode('---STREAM---\n');
    let streamStarted = false;
    const chunks = [];
    let received = 0;
    let rawBuf = new Uint8Array(0);

    while(true){
      const {done, value} = await reader.read();
      if(done) break;

      if(!streamStarted){
        // Accumulate raw bytes — never decode binary as text
        const merged = new Uint8Array(rawBuf.length + value.length);
        merged.set(rawBuf); merged.set(value, rawBuf.length);
        rawBuf = merged;
        // Search for delimiter in raw bytes
        const di = indexOfBytes(rawBuf, DELIM);
        if(di >= 0){
          for(const line of dec.decode(rawBuf.slice(0,di)).split('\n')) parseLine(line);
          const after = rawBuf.slice(di + DELIM.length);
          if(after.length > 0){ chunks.push(after); received += after.length; }
          if(received > MAX_BROWSER_DOWNLOAD_BYTES) throw new Error('影片過大，請改用桌面直接下載');
          streamStarted = true; rawBuf = null;
          $('progLbl').textContent = '下載中… 0 MB';
        } else {
          let lastNl = -1;
          for(let i=rawBuf.length-1;i>=0;i--) if(rawBuf[i]===0x0A){lastNl=i;break;}
          if(lastNl >= 0){
            for(const line of dec.decode(rawBuf.slice(0,lastNl)).split('\n')) parseLine(line);
            rawBuf = rawBuf.slice(lastNl + 1);
          }
        }
      } else {
        chunks.push(value);
        received += value.length;
        if(received > MAX_BROWSER_DOWNLOAD_BYTES) throw new Error('影片過大，請改用桌面直接下載');
        if(totalSize > 0){
          const pct = Math.min(99, Math.round(received / totalSize * 100));
          $('pb').style.width = pct + '%';
          $('progLbl').textContent = '下載中… ' + pct + '% (' + (received>>20) + ' MB)';
        } else {
          const fakePct = Math.min(90, Math.round(Math.sqrt(received / 1048576) * 15));
          $('pb').style.width = fakePct + '%';
          $('progLbl').textContent = '下載中… ' + (received>>20) + ' MB';
        }
      }
    }

    if(!streamStarted){
      if(rawBuf && rawBuf.length > 0){
        const lines=dec.decode(rawBuf).split('\n').filter(l=>l.trim());
        for(const line of lines) parseLine(line);
      }
      throw new Error('伺服器未回傳影片資料');
    }

    const blob = new Blob(chunks, {type:'video/mp4'});
    const file = new File([blob], filename, {type:'video/mp4'});
    $('pb').style.width = '100%';
    $('progLbl').textContent = '下載完成 ' + (received>>20) + ' MB';
    state.videoFile = file;
    state.blobUrl = URL.createObjectURL(blob);
    state.downloading = false;
    $('btnDl').disabled = false;
    showDownloadComplete();
  }catch(e){
    $('prog').classList.add('hidden');
    $('btnDl').disabled = false;
    state.downloading = false;
    showErr('下載失敗：' + e.message);
  }
}

function updateStatusLog(ev){
  const log = $('statusLog');
  const name = ev.instance || '?';
  const id = 'sl-' + name.replace(/[^a-z0-9]/gi, '_');
  let el = document.getElementById(id);
  if(!el){
    el = document.createElement('div');
    el.className = 'sl-item trying';
    el.id = id;
    log.appendChild(el);
  }
  if(ev.status === 'trying'){
    el.className = 'sl-item trying';
    el.textContent = '› ' + name + ' …';
  } else if(ev.status === 'ok'){
    el.className = 'sl-item ok';
    el.textContent = '✓ ' + name + ' (' + ev.method + ')';
    $('progLbl').textContent = '開始下載…';
  } else if(ev.status === 'fail'){
    el.className = 'sl-item fail';
    el.textContent = '✗ ' + name + (ev.detail ? ' — ' + ev.detail : '');
  } else if(ev.status === 'error'){
    el.className = 'sl-item fail';
    el.textContent = '✗ ' + (ev.detail || 'error');
  }
}

function downloadYTDirect(){
  const form = document.createElement('form');
  form.method='POST'; form.action=DOWNLOAD_ENDPOINT+'?direct=1'; form.target='_blank';
  const i1=document.createElement('input'); i1.type='hidden'; i1.name='url'; i1.value=state.url;
  const i2=document.createElement('input'); i2.type='hidden'; i2.name='videoQuality'; i2.value=state.quality;
  form.appendChild(i1); form.appendChild(i2);
  document.body.appendChild(form); form.submit(); document.body.removeChild(form);
  $('ok').classList.remove('hidden');
  $('okTxt').textContent='開始下載中…';
  state.downloading=false;
  $('btnDl').disabled=false;
}

function showDownloadComplete(){
  $('prog').classList.add('hidden');
  const v=$('vid');
  v.src=state.blobUrl; v.load();
  $('vp').classList.remove('hidden');
  $('ok').classList.remove('hidden');
  $('okTxt').textContent='下載完成！選擇儲存方式';
  $('saveActions').classList.remove('hidden');
  $('saveActions').style.display='flex';
}

async function saveToPhotos(){
  const file = state.videoFile;
  if(!file){ showErr('請先等待下載完成'); return; }
  if(state.sharing) return;
  if(!navigator.canShare || !navigator.canShare({files:[file]})){
    showErr('此裝置不支援分享功能，請使用「儲存到檔案」'); return;
  }
  state.sharing=true;
  try{
    for(let retry=0;retry<3;retry++){
      try{
        if(retry>0) await new Promise(r=>setTimeout(r,400));
        await navigator.share({files:[file]});
        $('ok').classList.remove('hidden');
        $('okTxt').textContent='已開啟分享單，點「儲存影片」存入相簿';
        return;
      }catch(e){
        if(e && e.name==='AbortError') return;
        if(e && e.name==='InvalidStateError' && retry<2) continue;
        showErr('分享失敗：'+e.message);
        return;
      }
    }
  }finally{ state.sharing=false; }
}

function saveToFiles(){
  if(!state.blobUrl){ showErr('請先等待下載完成'); return; }
  const a=document.createElement('a');
  a.href=state.blobUrl; a.download='video.mp4';
  a.style.display='none';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  $('ok').classList.remove('hidden');
  $('okTxt').textContent='已開始儲存到檔案';
}

function triggerDownload(url){
  const a=document.createElement('a');
  a.href=url; a.download='video.mp4';
  a.style.display='none';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  $('ok').classList.remove('hidden');
  $('okTxt').textContent='開始下載中…';
}

})();
</script>
